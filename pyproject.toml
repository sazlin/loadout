[project]
name = "loadout"
version = "0.26.0"
description = "Centralized, versioned Cursor rules and skills composed per project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.16.1",
  "pre-commit>=4.0",
  "pyrefly>=1.2.0",
  "types-pyyaml>=6.0.12.20260724",
]

[project.scripts]
loadout = "loadout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loadout"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extension = { mdc = "markdown" }
# Intentionally over-engineered / eval fixtures; keep smells out of lint noise.
exclude = ["agents/**/evals/files"]

[tool.ruff.lint.per-file-ignores]
"agents/**/evals/files/**" = ["ALL"]

[tool.pyrefly]
python-version = "3.12"
python-interpreter-path = ".venv/bin/python"
search-path = ["src", "tests"]
project-includes = ["src", "tests"]
project-excludes = ["agents/**/evals"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
