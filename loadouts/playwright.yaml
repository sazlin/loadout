name: playwright
description: >-
  Playwright Test Agents (planner, generator, healer), playwright-cli,
  plan-generate-heal skill, and dest-scoped e2e/ conventions.
extends:
  - base
rules:
  - src: rules/playwright/test-agents.mdc
  - src: rules/playwright/e2e-conventions.mdc
    dest: e2e/.cursor/rules/e2e-conventions.mdc
skills:
  - src: skills/playwright-agents
agents:
  - src: agents/playwright_planner/playwright_planner.md
  - src: agents/playwright_generator/playwright_generator.md
  - src: agents/playwright_healer/playwright_healer.md
cli_tools:
  - name: playwright-cli
    command: command -v playwright-cli >/dev/null || test -x node_modules/.bin/playwright-cli || npm install -D --no-fund --no-audit @playwright/cli@0.1.18
