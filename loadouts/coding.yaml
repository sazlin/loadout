name: coding
description: >-
  Opt-in ponytail lazy-senior-dev coding plus RTK (Token Killer) command
  compression: YAGNI ladder skills, globbed rule, session-start activation,
  pinned rtk binary, and a fail-open rewrite hook. Compose with language
  loadouts; does not extend base.
rules:
  - src: rules/coding/ponytail.mdc
skills:
  - src: skills/ponytail
  - src: skills/ponytail-review
  - src: skills/ponytail-audit
  - src: skills/ponytail-debt
  - src: skills/ponytail-gain
  - src: skills/ponytail-help
  - src: skills/rtk
  - src: skills/herdr
hooks:
  - src: hooks/ponytail-activate
  - src: hooks/rtk-rewrite
cli_tools:
  - name: rtk
    command: |
      set -euo pipefail
      if rtk --version 2>/dev/null | grep -q 0.50.0 && rtk gain >/dev/null 2>&1; then exit 0; fi
      os="$(uname -s)"; arch="$(uname -m)"
      case "$os-$arch" in
        Linux-x86_64) asset=rtk-x86_64-unknown-linux-musl.tar.gz; sum=bc2b8902b0d9c796c82ef45f16ae2307e17757afeca5ee156235a3dc7bda5f89 ;;
        Linux-aarch64) asset=rtk-aarch64-unknown-linux-gnu.tar.gz; sum=d1cc49dfa2cd443fc32625444b59fe616b6c80478cca210985118347174dd758 ;;
        Darwin-x86_64) asset=rtk-x86_64-apple-darwin.tar.gz; sum=ac23e20024ab3c71e7f50069f8b34190aec1b2d8f0c2cc19834039b3dac73373 ;;
        Darwin-arm64) asset=rtk-aarch64-apple-darwin.tar.gz; sum=fe54761a9950266e3a78ddb66a8af5e067251169da306a288e0751de63d836fe ;;
        *) echo "rtk: unsupported platform $os $arch" >&2; exit 1 ;;
      esac
      tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
      curl -fsSL -o "$tmp/$asset" "https://github.com/rtk-ai/rtk/releases/download/v0.50.0/$asset"
      if command -v sha256sum >/dev/null 2>&1; then actual="$(sha256sum "$tmp/$asset" | awk '{print $1}')"; else actual="$(shasum -a 256 "$tmp/$asset" | awk '{print $1}')"; fi
      test "$actual" = "$sum"
      tar -xzf "$tmp/$asset" -C "$tmp"
      mkdir -p "$HOME/.local/bin"
      install -m 755 "$tmp/rtk" "$HOME/.local/bin/rtk"
