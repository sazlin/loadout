repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi, markdown]
      - id: ruff-format
        name: ruff-format-mdc
        files: \.mdc$
        types_or: [text]
