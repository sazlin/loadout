name: PR review harness

on:
  pull_request:
    types: [opened, reopened]

# Dedupe uses two layers with different scope:
#
# 1. GitHub Actions concurrency (branch-scoped): group pr-review-<repo>-<head.ref>
#    serializes workflow runs on the same PR head branch. Overlapping runs wait;
#    cancel-in-progress is false so an in-flight dispatch is not aborted.
#
# 2. Pre-dispatch ACTIVE guard (PR-URL-scoped only): GET .../agents?prUrl=${PR_URL}
#    (paginated) skips POST when an ACTIVE agent named "PR review harness #<number>"
#    or legacy unnumbered "PR review harness" already exists on this pull request URL.
#    The Cursor agents list API filters by prUrl, not branch; this workflow cannot
#    list agents or dedupe by head ref from Actions.
#
# Implication: concurrency prevents duplicate dispatches from repeated workflow runs
# on one branch, but does not detect an orchestrator tied to another PR that shares
# the same head ref. The ACTIVE guard prevents duplicate harness runs on this PR URL
# only. Cross-PR / same-branch overlap is accepted until the API supports branch
# listing or filtering.
#
# After a successful POST, the job polls GET /v1/agents/{id}/runs/{runId} until the
# run is terminal so the GitHub check stays pending for the full harness, not just
# the create handshake.
concurrency:
  group: pr-review-${{ github.repository }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch-orchestrator:
    runs-on: ubuntu-latest
    # Dedupe/POST curl budget is minutes; waiting for the harness run can take hours.
    # GitHub-hosted jobs allow up to 360 minutes.
    timeout-minutes: 360
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Launch review_orchestrator on this pull request
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ -z "${CURSOR_API_KEY}" ]]; then
            echo "CURSOR_API_KEY is not set; skipping review_orchestrator dispatch." >&2
            echo "Add a Cursor API key at Settings → Secrets and variables → Actions to enable auto-review." >&2
            exit 0
          fi
          # BEGIN ACTIVE_DEDUPE
          # ACTIVE dedupe is PR-URL-scoped (prUrl query below); no branch-level list API.
          dedupe_negative_scan_done=false
          agent_name="PR review harness #${PR_NUMBER}"
          legacy_agent_name="PR review harness"
          check_active_harness_agents() {
            active_count=0
            legacy_active_count=0
            agents_list_failed=false
            page_cursor=""
            page_num=0
            max_pages=5
            while [[ "${page_num}" -lt "${max_pages}" ]]; do
              page_num=$((page_num + 1))
              agents_url="https://api.cursor.com/v1/agents?prUrl=${PR_URL}&limit=20&includeArchived=false"
              if [[ -n "${page_cursor}" ]]; then
                agents_url="${agents_url}&cursor=${page_cursor}"
              fi
              agents_json=""
              for attempt in 1 2 3; do
                if agents_json="$(curl --silent --show-error --fail-with-body \
                  --connect-timeout 10 \
                  --max-time 30 \
                  --url "${agents_url}" \
                  -u "${CURSOR_API_KEY}:" 2>/dev/null)" \
                  && jq -e '.items | type == "array"' <<<"${agents_json}" >/dev/null 2>&1; then
                  break
                fi
                agents_json=""
                if [[ "${attempt}" -lt 3 ]]; then
                  sleep 2
                fi
              done
              if [[ -z "${agents_json}" ]]; then
                agents_list_failed=true
                break
              fi
              page_active="$(jq --arg name "${agent_name}" \
                '[.items[]? | select(.status == "ACTIVE" and .name == $name)] | length' \
                <<<"${agents_json}")"
              page_legacy="$(jq --arg legacy "${legacy_agent_name}" \
                '[.items[]? | select(.status == "ACTIVE" and .name == $legacy)] | length' \
                <<<"${agents_json}")"
              active_count=$((active_count + page_active))
              legacy_active_count=$((legacy_active_count + page_legacy))
              if [[ "${page_active}" -gt 0 ]] || [[ "${page_legacy}" -gt 0 ]]; then
                break
              fi
              page_cursor="$(jq -r '.nextCursor // empty' <<<"${agents_json}")"
              if [[ -z "${page_cursor}" ]]; then
                break
              fi
            done
          }
          skip_if_active_harness_exists() {
            check_active_harness_agents
            if [[ "${agents_list_failed}" == true ]]; then
              echo "Skipping review_orchestrator dispatch: could not list agents for ${PR_URL}; dedupe state unknown." >&2
              echo "Re-run this workflow after the agents API is reachable." >&2
              exit 0
            fi
            total_active=$((active_count + legacy_active_count))
            if [[ "${total_active}" -gt 0 ]]; then
              echo "Skipping review_orchestrator dispatch: ${active_count} numbered (${agent_name}) and ${legacy_active_count} legacy (${legacy_agent_name}) active agent(s) on ${PR_URL}." >&2
              echo "Wait for the orchestrator to finish before re-running this workflow." >&2
              exit 0
            fi
            if [[ "${page_num}" -ge "${max_pages}" ]] && [[ -n "${page_cursor}" ]]; then
              echo "Warning: agents list pagination cap (${max_pages} pages) reached with unscanned pages for ${PR_URL}; no ACTIVE harness agents found in scanned pages. Proceeding with dispatch." >&2
              echo "An ACTIVE harness on unscanned pages could cause duplicate orchestrators." >&2
            fi
            dedupe_negative_scan_done=true
          }
          skip_if_active_harness_exists
          # END ACTIVE_DEDUPE
          # BEGIN PROMPT_BUILD
          # Dual-heredoc invariant: both blocks use <<'EOF' (quoted delimiter) so backticks
          # in the prompt stay literal; unquoted <<EOF would expand nested `...` substitutions.
          prompt="$(cat <<'EOF'
          You are review_orchestrator. Follow '.claude/agents/review_orchestrator.md' and the skills it names under '.claude/skills/'. Dispatch those agents; do not become them.
          EOF
          )"
          prompt="${prompt}

          This GitHub pull request is the change set: ${PR_URL} (#${PR_NUMBER}). Run the full harness on this existing PR.

          $(cat <<'EOF'
          Cloud-run constraints:
          - Follow '.claude/agents/review_orchestrator.md' for the harness loop and role boundaries (panel, resolve, verify, decision).
          - Work on the current PR branch only. Do not open a second PR. Do not create a draft. Nested agent launches must keep autoCreatePR off.
          - Do not rewrite git history. No force-push, no rebase, no amend of commits you did not just create.
          - issue_resolver may commit and push to this PR branch only.
          EOF
          )"
          # END PROMPT_BUILD
          # Named cloud env is mutually exclusive with explicit repos. PR context
          # stays in the prompt; loadout-env already binds the repository.
          body="$(jq -n \
            --arg prompt "$prompt" \
            --arg name "${agent_name}" \
            '{
              name: $name,
              prompt: {text: $prompt},
              env: {type: "cloud", name: "loadout-env"},
              workOnCurrentBranch: true,
              autoCreatePR: false
            }')"
          # BEGIN POST_DISPATCH
          dispatch_output=""
          last_dispatch_error=""
          for attempt in 1 2 3; do
            if [[ "${attempt}" -ne 1 ]] || [[ "${dedupe_negative_scan_done}" != true ]]; then
              skip_if_active_harness_exists
            fi
            if dispatch_output="$(curl --silent --show-error --fail-with-body \
              --connect-timeout 10 \
              --max-time 60 \
              --url https://api.cursor.com/v1/agents \
              -u "${CURSOR_API_KEY}:" \
              --header 'Content-Type: application/json' \
              --data "$body" 2>/dev/null)" \
              && jq -e '((.agent.id // .id) | type == "string" and length > 0)' <<<"${dispatch_output}" >/dev/null 2>&1; then
              break
            fi
            last_dispatch_error="${dispatch_output}"
            dispatch_output=""
            if [[ "${attempt}" -lt 3 ]]; then
              sleep 2
            fi
          done
          if [[ -z "${dispatch_output}" ]]; then
            echo "Failed to dispatch review_orchestrator after 3 attempts." >&2
            if [[ -n "${last_dispatch_error}" ]]; then
              echo "${last_dispatch_error}" >&2
            fi
            exit 1
          fi
          echo "${dispatch_output}"
          # END POST_DISPATCH
          # BEGIN WAIT_FOR_RUN
          agent_id=""
          run_id=""
          cancel_active_run() {
            if [[ -z "${agent_id}" || -z "${run_id}" ]]; then
              return 0
            fi
            echo "Cancelling ${run_id} on ${agent_id} after job interrupt." >&2
            curl --silent --show-error --request POST \
              --connect-timeout 10 \
              --max-time 30 \
              --url "https://api.cursor.com/v1/agents/${agent_id}/runs/${run_id}/cancel" \
              -u "${CURSOR_API_KEY}:" || true
          }
          trap cancel_active_run INT TERM
          wait_for_run() {
            echo "Waiting for ${agent_id} run ${run_id} (https://cursor.com/agents/${agent_id})"
            failures=0
            while true; do
              if ! run_json="$(curl --silent --show-error --fail-with-body \
                --connect-timeout 10 \
                --max-time 30 \
                --url "https://api.cursor.com/v1/agents/${agent_id}/runs/${run_id}" \
                -u "${CURSOR_API_KEY}:")"; then
                failures=$((failures + 1))
                if [[ "${failures}" -ge 5 ]]; then
                  echo "Giving up after ${failures} failed status polls." >&2
                  exit 1
                fi
                echo "Status poll failed (attempt ${failures}); retrying." >&2
                sleep 30
                continue
              fi
              failures=0
              status="$(jq -er '.status' <<<"${run_json}")"
              echo "run ${run_id} status=${status}"
              case "${status}" in
                FINISHED) exit 0 ;;
                ERROR|CANCELLED|EXPIRED)
                  echo "${run_json}" >&2
                  exit 1
                  ;;
                CREATING|RUNNING)
                  sleep 30
                  ;;
                *)
                  echo "unexpected run status: ${status}; continuing to poll." >&2
                  sleep 30
                  ;;
              esac
            done
          }
          agent_id="$(jq -er '.agent.id // .id' <<<"${dispatch_output}")"
          run_id="$(jq -r '.run.id // empty' <<<"${dispatch_output}")"
          if [[ -z "${run_id}" ]]; then
            agent_json="$(curl --silent --show-error --fail-with-body \
              --connect-timeout 10 \
              --max-time 30 \
              --url "https://api.cursor.com/v1/agents/${agent_id}" \
              -u "${CURSOR_API_KEY}:")"
            run_id="$(jq -er '.latestRunId' <<<"${agent_json}")"
          fi
          wait_for_run
          # END WAIT_FOR_RUN
