name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2
      - run: uv sync --all-extras
      - run: just lint && just test
      - name: Pyrefly type check
        run: uv run pyrefly check --output-format=github

  loadouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Resolve and sync every loadout
        env:
          LOADOUT_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          loadouts=("$GITHUB_WORKSPACE"/loadouts/*.yaml)
          if [[ ${#loadouts[@]} -eq 0 ]]; then
            echo "No loadouts/*.yaml found" >&2
            exit 1
          fi
          for yaml in "${loadouts[@]}"; do
            name="$(basename "$yaml" .yaml)"
            echo "::group::${name}"
            project="$(mktemp -d)"
            cat > "$project/.loadout.yaml" <<EOF
          source: https://github.com/sazlin/loadout
          ref: main
          loadouts: [$name]
          EOF
            if ! (cd "$project" && uv run --project "$GITHUB_WORKSPACE" loadout resolve --list); then
              echo "::error::resolve failed for ${name}"
              failed=1
            fi
            if ! (cd "$project" && uv run --project "$GITHUB_WORKSPACE" loadout sync); then
              echo "::error::sync failed for ${name}"
              failed=1
            else
              if find "$project" -type d -name evals | grep -q .; then
                echo "Found evals/ in vendored output for ${name}:" >&2
                find "$project" -type d -name evals >&2
                failed=1
              fi
              if find "$project" -type d -name '*-workspace' | grep -q .; then
                echo "Found *-workspace/ in vendored output for ${name}:" >&2
                find "$project" -type d -name '*-workspace' >&2
                failed=1
              fi
            fi
            rm -rf "$project"
            echo "::endgroup::"
          done
          exit "${failed}"
